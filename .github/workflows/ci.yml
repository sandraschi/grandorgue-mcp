name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Python backend
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run ruff check src/ tests/
      - run: uv run pytest -q

  webapp:
    name: Webapp frontend
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: web_sota
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx @biomejs/biome check src/
      - run: bunx tsc -b
      - run: bun run build

  e2e:
    name: Playwright e2e
    runs-on: windows-latest
    needs: [webapp]
    defaults:
      run:
        shell: pwsh
        working-directory: web_sota
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
        working-directory: ./
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx playwright install chromium
      # Backend + frontend are started by Playwright's webServer config
      - run: bunx playwright test
