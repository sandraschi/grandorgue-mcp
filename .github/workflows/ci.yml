name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Python backend
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run ruff check src/ tests/
      - run: uv run pytest -q

  webapp:
    name: Webapp frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_sota
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web_sota/package-lock.json
      - run: npm ci
      - run: npx @biomejs/biome check src/
      - run: npx tsc -b
      - run: npm run build

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: [webapp]
    defaults:
      run:
        working-directory: web_sota
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
        working-directory: ./
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web_sota/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test
